passage:
  - hanzi: "我每天早上六点起床。"
    pinyin: "wǒ měi tiān zǎo shang liù diǎn qǐ chuáng."
    vi: "Mỗi sáng tôi thức dậy lúc 6 giờ."
  - hanzi: "起床以后，我先刷牙，然后吃早饭。"
    pinyin: "qǐ chuáng yǐ hòu, wǒ xiān shuā yá, rán hòu chī zǎo fàn."
    vi: "Sau khi dậy, tôi đánh răng trước, rồi ăn sáng."
  - hanzi: "我七点半骑自行车去学校。"
    pinyin: "wǒ qī diǎn bàn qí zì xíng chē qù xué xiào."
    vi: "Tôi đi xe đạp đến trường lúc 7 giờ rưỡi."
  - hanzi: "下午五点我回家。"
    pinyin: "xià wǔ wǔ diǎn wǒ huí jiā."
    vi: "5 giờ chiều tôi về nhà."
  - hanzi: "晚上我做作业，看电视，十一点睡觉。"
    pinyin: "wǎn shang wǒ zuò zuò yè, kàn diàn shì, shí yī diǎn shuì jiào."
    vi: "Tối tôi làm bài tập, xem TV, 11 giờ đi ngủ."
