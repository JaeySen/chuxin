passage: |
  梅兰芳是中国非常有名的京剧演员。
  他从小就开始学习京剧，他的表演艺术影响了很多人。
  他不但在中国非常有名，在国外也很受欢迎。
  他还把中国的京剧介绍到了美国和苏联。
