# nginx site for the Sotam API.
# After `certbot --nginx -d api.sotam.example` runs, certbot will inject the
# `listen 443 ssl;` block and the TLS certificate paths automatically.
#
# Install:
#   sudo cp deploy/nginx-sotam.conf /etc/nginx/sites-available/sotam
#   sudo ln -s /etc/nginx/sites-available/sotam /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.sotam.example

server {
    listen 80;
    server_name api.sotam.example;

    # Keep HTTP up for the Let's Encrypt ACME challenge; everything else gets
    # redirected to HTTPS after certbot rewrites this file.

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (Socket.io — Phase 2)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout          86400;
    }
}
